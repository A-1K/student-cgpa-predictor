<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}HabitML{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #080C10;
      --surface:  #0D1117;
      --surface2: #161B22;
      --border:   #21262D;
      --border2:  #30363D;
      --cyan:     #00E5FF;
      --green:    #39D353;
      --purple:   #7C3AED;
      --orange:   #F97316;
      --red:      #EF4444;
      --text:     #E6EDF3;
      --muted:    #7D8590;
      --muted2:   #484F58;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,229,255,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,58,237,0.03) 0%, transparent 50%);
    }

    /* ── SCANLINE OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── NAV */
    nav {
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(12px);
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .nav-brand {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-brand .logo-mark {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #000;
    }
    .nav-brand .brand-text span { color: var(--cyan); }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all 0.15s;
      font-family: 'Space Mono', monospace;
    }
    .nav-links a:hover { color: var(--text); background: var(--surface2); }
    .nav-links a.active { color: var(--cyan); background: rgba(0,229,255,0.08); }

    /* ── LAYOUT */
    .container { max-width: 1280px; margin: 0 auto; padding: 40px 32px; }

    /* ── PAGE HEADER */
    .page-header { margin-bottom: 40px; }
    .page-header .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-header .eyebrow::before {
      content: '';
      display: inline-block;
      width: 20px; height: 1px;
      background: var(--cyan);
    }
    .page-header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .page-header h1 span { color: var(--cyan); }
    .page-header p { font-size: 14px; color: var(--muted); }

    /* ── CARDS */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.3;
    }
    .card-title {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .card-title .dot {
      width: 6px; height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--cyan);
    }

    /* ── TABLE */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: var(--surface2);
      color: var(--muted);
      padding: 10px 16px;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    tr.best-row td { background: rgba(0,229,255,0.04); }
    tr.best-row td:first-child { border-left: 2px solid var(--cyan); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,229,255,0.12);
      color: var(--cyan);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
      border: 1px solid rgba(0,229,255,0.2);
    }

    /* ── PLOT IMGS */
    .plot-img { width: 100%; height: auto; display: block; border-radius: 6px; }

    /* ── GRID */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    /* ── TAG LIST */
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .tag {
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.2);
      color: var(--cyan);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
    }
    .tag.zero {
      background: rgba(125,133,144,0.08);
      border-color: var(--border2);
      color: var(--muted2);
      text-decoration: line-through;
    }

    /* ── FOOTER */
    footer {
      margin-top: 60px;
      padding: 20px 48px;
      border-top: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted2);
      display: flex;
      justify-content: space-between;
    }

    /* ── TERMINAL CURSOR BLINK */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { display: inline-block; width: 8px; height: 14px; background: var(--cyan); animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      nav { padding: 0 16px; }
      .container { padding: 24px 16px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <div class="logo-mark">H</div>
    <span class="brand-text">Habit<span>ML</span></span>
  </a>
  <div class="nav-links">
    <a href="/" id="nav-dashboard">// dashboard</a>
    <a href="/predict" id="nav-predict">// predictor</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <span>DS-211 &nbsp;·&nbsp; Talal Tariq (2024633) &amp; Abdul Kabeer (2024288)</span>
  <span>HabitML &nbsp;·&nbsp; GIKI Survey &nbsp;·&nbsp; 5-Model Ensemble</span>
</footer>

</body>
</html>
<script>
  (function(){
    var path = window.location.pathname;
    if(path === '/' || path === '') document.getElementById('nav-dashboard').classList.add('active');
    if(path.startsWith('/predict')) document.getElementById('nav-predict').classList.add('active');
  })();
</script>
